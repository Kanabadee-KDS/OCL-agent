# OCL Agent on the shared on-prem server. Rules: docs/server-constraints.md
#   - every command:  docker compose -f deploy/docker-compose.yml ...
#   - only Caddy publishes a port, bound to the Tailscale IP, never 0.0.0.0
#   - Ollama is NOT here: it is the host's systemd service (host.docker.internal)
#   - never `docker ... prune`
name: ocl

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${OCL_BIND_IP:-100.104.172.122}:${OCL_PORT:-8100}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ocl_caddy:/data
    depends_on:
      - api
      - web

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ocl
      POSTGRES_USER: ocl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - ocl_pg:/var/lib/postgresql/data
    # no `ports:` on purpose: only Caddy publishes a port (rule 8); api/worker reach it
    # over the compose network as db:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocl -d ocl"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: ocl-api:poc
    restart: unless-stopped
    env_file: .env
    environment:
      INLINE_WORKER: "false"
      DATA_DIR: /server_data
      DATABASE_URL: postgresql://ocl:${POSTGRES_PASSWORD}@db:5432/ocl
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      CORS_ORIGINS: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ocl_files:/server_data
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: ocl-api:poc
    restart: unless-stopped
    command: ["ocl", "worker"]
    healthcheck:
      disable: true  # the image's healthcheck probes the API port; the worker has none
    env_file: .env
    environment:
      DATA_DIR: /server_data
      DATABASE_URL: postgresql://ocl:${POSTGRES_PASSWORD}@db:5432/ocl
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ocl_files:/server_data
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ""
    image: ocl-web:poc
    restart: unless-stopped
    depends_on:
      - api

volumes:
  ocl_files:
  ocl_caddy:
  ocl_pg:  # never `docker volume prune` on this host (rule 6)
