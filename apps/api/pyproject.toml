[project]
name = "ocl-api"
version = "0.1.0"
description = "OCL Agent API and worker: curriculum book ingestion and AI extraction"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.9",
    "openpyxl>=3.1.5",
    "segno>=1.6",
]

[project.scripts]
ocl = "ocl_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocl_api"]
