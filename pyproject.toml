[project]
name = "ocl-agent"
version = "0.0.0"
description = "OCL Agent monorepo (uv workspace root)"
requires-python = ">=3.12"
dependencies = ["ocl-api"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api"]

[tool.uv.sources]
ocl-api = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["samples", "data", "apps/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ocl_api"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
