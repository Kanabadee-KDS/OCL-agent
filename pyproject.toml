[project]
name = "ocl-agent"
version = "0.0.0"
description = "OCL Agent monorepo (uv workspace root)"
requires-python = ">=3.12"
dependencies = ["ocl-api"]

[dependency-groups]
dev = [
    "pgserver>=0.1.4",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api"]

[tool.uv.sources]
ocl-api = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["samples", "data", "apps/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency idiom (Depends/File/Form/Query in defaults) is intentional
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# Thai review-sheet strings read better unwrapped
"apps/api/src/ocl_api/extract/golden.py" = ["E501"]
# field table with Thai labels and options
"apps/api/src/ocl_api/extract/info.py" = ["E501"]
# fixtures quote whole lines of the books
"apps/api/tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ocl_api"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
